# 量化程序主配置（P0）
# 约定：币安仅使用 .vision 镜像域名；所有外网请求必须经本地代理。

[network]
# 本地代理（必填）。优先级：QUANT_PROXY 环境变量 > HTTPS_PROXY/HTTP_PROXY
# 系统代理环境变量 > 本配置项。
# 留空 = 自动使用系统代理环境变量（本机系统代理端口随会话变化，推荐留空）。
proxy = ""
# WS 组合流端点（multiplexed stream）
ws_url = "wss://data-stream.binance.vision/stream"
# REST 端点（K 线/历史数据）
rest_url = "https://data-api.binance.vision"
# WS 业务级空闲看门狗：超过该秒数未收到任何消息则重连
ws_idle_timeout_sec = 60.0
# REST 单次请求超时（秒）
rest_timeout_sec = 10.0
# WS 重连指数退避上限（秒）
ws_max_backoff_sec = 30.0

[market]
# 默认监控币种（大写），可在配置中增删
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT"]

[indicators]
# 每币种已收盘 1min K 线环形窗口容量
candle_window = 300
# RSI 周期
rsi_length = 14
# 短期/长期均线周期
ma_short = 5
ma_long = 25
# 成交量均量周期
vol_ma_length = 20

[rules.price_move]
enabled = true
# 回看窗口（分钟）与涨跌幅阈值（%）
window_min = 5
threshold_pct = 5.0

[rules.volume_spike]
enabled = true
# 当前量超过均量的倍数阈值
multiplier = 3.0

[rules.rsi]
enabled = true
# 超买/超卖阈值
overbought = 70.0
oversold = 30.0

[rules.ma_cross]
enabled = true

[alerts]
# 同币种同规则告警冷却（秒），防止重复轰炸
cooldown_sec = 300.0
# 告警滚动日志（JSONL，相对仓库根解析）
log_path = "data/alerts.jsonl"

[storage]
# SQLite 数据库路径（相对仓库根解析）
db_path = "data/quant.db"

[cli]
# 看板渲染刷新周期（秒）
refresh_interval_sec = 0.5

# =====================================================================
# M2 跨市场监控与模拟盘（P1-1 ~ P1-6）
# =====================================================================

[market.a_share]
# A股轮询适配器开关
enabled = true
# 默认自选（沪深高流动性蓝筹，可增删）
watchlist = ["600519.SH", "600036.SH", "000001.SZ", "300750.SZ"]
# 轮询间隔（秒）
poll_interval_sec = 3.0

[market.hk_us]
# 美股/港股轮询适配器开关
enabled = true
# 美股默认自选
watchlist_us = ["AAPL.US", "MSFT.US", "NVDA.US", "TSLA.US"]
# 港股默认自选
watchlist_hk = ["0700.HK", "9988.HK", "3690.HK"]
# 轮询间隔（秒）
poll_interval_sec = 3.0

[paper]
# 模拟盘总开关（false = 退回 M1 仅告警）
enabled = true
# 下单模式：auto 自动下单 / manual 待确认
mode = "manual"
# 每笔信号投入可用现金比例（%）
position_pct = 10.0
# 全局滑点（bps，不利于成交方）；可按市场费率表覆盖
slippage_bps = 5.0
# manual 模式待确认超时（秒）
confirm_timeout_sec = 300.0
# 单标的单仓位约束（true = 同标的仅一个仓位）
one_position_per_symbol = true

[paper.initial_cash]
# 各市场初始虚拟资金（计价货币：USDT/CNY/USD/HKD）
crypto = 100000.0
a_share = 100000.0
us = 100000.0
hk = 100000.0

[paper.fees]
# 加密货币 taker 费率
crypto_taker = 0.001
# A股：佣金（双边）+ 卖出印花税 + 过户费
a_share_commission = 0.00025
a_share_stamp_tax = 0.001
a_share_transfer = 0.00001
# 美股佣金
us_commission = 0.0
# 港股：佣金 + 印花税（双边）
hk_commission = 0.0003
hk_stamp_tax = 0.001

[rules]
# 自定义规则登记（P1-5 插件化）：["模块路径:类名", ...]
custom = []
